# Основные метаданные сайта
site_name: Мой Блог
site_url: https://nikitatichonow.github.io/mkdocs-demo/
site_author: Nikita Tichonow

# Copyright в футере
copyright: © 2026 Nikita Tichonow

# Тема оформления
theme:
  name: material
  language: ru
  custom_dir: docs/overrides

  # Цветовая палитра
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Переключиться на светлую тему

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Переключиться на тёмную тему

  # Фон и дополнительные стили
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

  # Фон сайта (градиент/изображение)
  # Опционально: можно добавить фоновое изображение

# Кастомизация
extra:
  generator: false
  # Социальные иконки
  social:
    - icon: fontawesome/brands/envelope
      link: "mailto:nik7674@yandex.ru"
      name: Email
    - icon: fontawesome/brands/github
      link: https://github.com/NikitaTichonow
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/
      name: Telegram
    - icon: fontawesome/brands/vk
      link: https://vk.com/
      name: VK

# Репозиторий
repo_url: https://github.com/NikitaTichonow/mkdocs-demo
repo_name: GitHub
edit_uri: edit/main/docs/

# Навигация
nav:
  - Главная: index.md
  - Обо мне: about.md
  - Обратная связь: feedback.md

# Плагины
plugins:
  - search
  - minify:
      minify_html: true
  - git-commit
  - git-committers

# Дополнительные CSS стили
extra_css:
  - styles/extra.css